# Opt-in local hygiene hooks. Enable with: uv run pre-commit install
# One-shot over the tree: uv run pre-commit run --all-files
#
# ruff lints (check + autofix) under the rule set in pyproject.toml. The ruff
# *formatter* (ruff-format) is still deferred until a one-shot line-length-100
# reformat lands; secret scanning (gitleaks) is tracked separately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: '^uv\.lock$'  # the committed lockfile is legitimately large (~824 KB)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff  # linter only (no ruff-format); config in pyproject.toml [tool.ruff]
        args: [--fix]
